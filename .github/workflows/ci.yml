name: CI

on:
    pull_request:
    push:
        branches: [master]

permissions:
    contents: read

concurrency:
    # PRs share one group per branch, so a new push cancels the stale run.
    # Pushes to master get a unique group per commit, so nothing is cancelled or skipped.
    group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Java 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Build and verify
              run: ./mvnw -B verify

            - name: Upload test reports
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: |
                      target/surefire-reports/
                      target/failsafe-reports/
                  retention-days: 7
